services:
  ganache:
    image: trufflesuite/ganache:v7.9.2
    restart: unless-stopped
    command:
      - --server.host=0.0.0.0
      - --server.port=8545
      - --chain.chainId=1337
      - --chain.networkId=1337
      - --chain.hardfork=shanghai
      - --wallet.totalAccounts=3
      - --wallet.defaultBalance=100
      - --logging.quiet=true
    ports:
      - "127.0.0.1:${LOCAL_EVM_PORT:-8545}:8545"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  graph-node:
    depends_on:
      ganache:
        condition: service_started
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    environment:
      ethereum: ganache-local:http://ganache:8545
