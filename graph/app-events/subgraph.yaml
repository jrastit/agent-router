specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: HederaAppEventJournal
    network: hedera-testnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: HederaAppEventJournal
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AppEvent
      abis:
        - name: HederaAppEventJournal
          file: ./abis/HederaAppEventJournal.json
      eventHandlers:
        - event: AppEventRecorded(indexed bytes32,indexed bytes32,string,bytes32,uint16)
          handler: handleAppEventRecorded
      file: ./src/mapping.ts
