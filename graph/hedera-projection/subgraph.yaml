specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: HederaEventAnchor
    network: ganache-local
    source:
      abi: HederaEventAnchor
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - HederaEventAnchor
      abis:
        - name: HederaEventAnchor
          file: ./abis/HederaEventAnchor.json
      eventHandlers:
        - event: HederaEventAnchored(indexed bytes32,indexed uint8,string,bytes32,string,uint64,string,bytes32,uint16,indexed address)
          handler: handleHederaEventAnchored
      file: ./src/mapping.ts
